<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Growra - To-Do List</title>
  <link rel="stylesheet" href="/assets/style/to_do.css" />
</head>
<body>
  <div class="container">
    <h1>📝 Growra To-Do List</h1>

    <div class="todo-input">
      <input type="text" id="task-input" placeholder="Add a new task..." />
      <button id="add-btn">Add</button>
    </div>

    <ul id="task-list"></ul>

    <button id="toggle-mode">🌗 Toggle Mode</button>
  </div>

  <script>
    const taskInput = document.getElementById("task-input");
const addBtn = document.getElementById("add-btn");
const taskList = document.getElementById("task-list");
const toggleModeBtn = document.getElementById("toggle-mode");

addBtn.addEventListener("click", () => {
  const taskText = taskInput.value.trim();
  if (taskText === "") return;

  const li = document.createElement("li");
  li.textContent = taskText;

  const actions = document.createElement("div");
  actions.classList.add("task-actions");

  const completeBtn = document.createElement("button");
  completeBtn.classList.add("complete");
  completeBtn.textContent = "✓";
  completeBtn.onclick = () => {
    li.classList.toggle("completed");
  };

  const deleteBtn = document.createElement("button");
  deleteBtn.classList.add("delete");
  deleteBtn.textContent = "✗";
  deleteBtn.onclick = () => {
    li.remove();
  };

  actions.appendChild(completeBtn);
  actions.appendChild(deleteBtn);
  li.appendChild(actions);
  taskList.appendChild(li);

  taskInput.value = "";
});

toggleModeBtn.addEventListener("click", () => {
  document.body.classList.toggle("light-mode");
  if (document.body.classList.contains("light-mode")) {
    document.documentElement.style.setProperty('--bg', '#ffffff');
    document.documentElement.style.setProperty('--fg', '#000000');
    document.documentElement.style.setProperty('--card', '#f0f0f0');
  } else {
    document.documentElement.style.setProperty('--bg', '#0e1a2b');
    document.documentElement.style.setProperty('--fg', '#ffffff');
    document.documentElement.style.setProperty('--card', '#152c44');
  }
});

  </script>
</body>
</html>
